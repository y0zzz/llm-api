name: LLM API Pipeline

on:
  push:
    branches: [ "main" ]

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      env:
        API_KEY: test-key
        CLOUDFLARE_ACCOUNT_ID: fake-id
        CLOUDFLARE_API_TOKEN: fake-token
        DATABASE_URL: sqlite:///./test.db
      run: |
        pytest test_main.py

  build-and-test:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t llm-api:local .

    - name: Verify Container Structure
      run: |
        docker run -d -p 8080:8080 \
          -e CLOUDFLARE_ACCOUNT_ID=fake-id \
          -e CLOUDFLARE_API_TOKEN=fake-token \
          -e API_KEY=test-key \
          -e DATABASE_URL=sqlite:///./test.db \
          --name test-app llm-api:local
        sleep 5
        docker ps | grep test-app
